[package]
name = "app"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace]
members = [
    "apps/shared",
    "apps/domain",
    "apps/application",
    "apps/infrastructure",
    "apps/presentation",
]
default-members = ["."]
resolver = "2"

[dependencies]
anyhow = "1.0.100"
application = { path = "apps/application" }
axum = { version = "0.8.9", features = ["json", "http2"] }
domain = { path = "apps/domain" }
hiqlite = { version = "0.16.0", default-features = false, features = ["sqlite", "auto-heal"] }
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "server-graceful", "service", "tokio"] }
infrastructure = { path = "apps/infrastructure" }
presentation = { path = "apps/presentation" }
shared = { path = "apps/shared" }
tokio = { version = "1.54", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tonic = { version = "0.14.9", features = ["transport"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }

[dev-dependencies]
async-trait = "0.1.89"
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4"] }
