name: Publish container images

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: builder
            tag-prefix: builder-
            latest-tag: builder-latest
          - target: runtime
            tag-prefix: ''
            latest-tag: latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag,prefix=${{ matrix.tag-prefix }}
            type=raw,value=${{ matrix.latest-tag }}

      - name: Build and publish image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.target }}

      - name: Remove retired base images
        if: matrix.target == 'runtime'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            owner_path="orgs"
          else
            owner_path="users"
          fi
          versions_path="/$owner_path/$OWNER/packages/container/${PACKAGE,,}/versions"
          versions=$(gh api --paginate "$versions_path?per_page=100" --jq '
            .[]
            | select((.metadata.container.tags | length) > 0)
            | select(all(.metadata.container.tags[]; startswith("base-")))
            | .id')
          while IFS= read -r version; do
            if [[ -n "$version" ]]; then
              gh api --method DELETE "$versions_path/$version"
            fi
          done <<< "$versions"
