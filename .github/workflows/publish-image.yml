name: Publish container images

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    steps:
      - name: Verify native architecture
        env:
          NATIVE_MACHINE: ${{ matrix.machine }}
        run: test "$(uname -m)" = "$NATIVE_MACHINE"

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: type=ref,event=tag

      - name: Build and push builder by digest
        id: builder
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: builder
          platforms: linux/${{ matrix.arch }}
          build-args: CARGO_BUILD_JOBS=4
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-builder-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-builder-${{ matrix.arch }}

      - name: Build and push runtime by digest
        id: runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/${{ matrix.arch }}
          build-args: BUILDER_IMAGE=${{ steps.image.outputs.name }}@${{ steps.builder.outputs.digest }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export image digests
        env:
          BUILDER_DIGEST: ${{ steps.builder.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime.outputs.digest }}
        run: |
          [[ "$BUILDER_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$RUNTIME_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests/builder" "$RUNNER_TEMP/digests/runtime"
          touch "$RUNNER_TEMP/digests/builder/${BUILDER_DIGEST#sha256:}"
          touch "$RUNNER_TEMP/digests/runtime/${RUNTIME_DIGEST#sha256:}"

      - name: Upload image digests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.target }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: builder
            tag-prefix: builder-
            latest-tag: builder-latest
          - target: runtime
            tag-prefix: ''
            latest-tag: latest
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Prepare image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=ref,event=tag,prefix=${{ matrix.tag-prefix }}
            type=raw,value=${{ matrix.latest-tag }}

      - name: Publish multi-architecture manifest
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TARGET: ${{ matrix.target }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          shopt -s nullglob
          digests=("$RUNNER_TEMP/digests/$IMAGE_TARGET"/*)
          [[ ${#digests[@]} -eq 2 ]]
          manifest_args=()
          while IFS= read -r image_tag; do
            if [[ -n "$image_tag" ]]; then
              manifest_args+=(--tag "$image_tag")
            fi
          done <<< "$IMAGE_TAGS"
          [[ ${#manifest_args[@]} -gt 0 ]]
          for digest_file in "${digests[@]}"; do
            digest="${digest_file##*/}"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            manifest_args+=("$IMAGE_NAME@sha256:$digest")
          done
          docker buildx imagetools create "${manifest_args[@]}"

      - name: Remove retired base images
        if: matrix.target == 'runtime'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          OWNER_TYPE: ${{ github.event.repository.owner.type }}
          PACKAGE: ${{ github.event.repository.name }}
        run: |
          if [[ "$OWNER_TYPE" == "Organization" ]]; then
            owner_path="orgs"
          else
            owner_path="users"
          fi
          versions_path="/$owner_path/$OWNER/packages/container/${PACKAGE,,}/versions"
          versions=$(gh api --paginate "$versions_path?per_page=100" --jq '
            .[]
            | select((.metadata.container.tags | length) > 0)
            | select(all(.metadata.container.tags[]; startswith("base-")))
            | .id')
          while IFS= read -r version; do
            if [[ -n "$version" ]]; then
              gh api --method DELETE "$versions_path/$version"
            fi
          done <<< "$versions"
