[package]
name = "rslint"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
proc-macro2 = { version = "1.0", features = ["span-locations"] }
ra-ap-rustc_lexer = "0.185.0"
syn = { version = "2.0", features = ["full", "visit"] }

[dev-dependencies]
tempfile = "3.23"
